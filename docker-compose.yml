version: '3.8'

services:
  # Redis message broker for Celery
  redis:
    image: redis:7-alpine
    container_name: studypath-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    volumes:
      - redis_data:/data

  # FastAPI Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: studypath-backend
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=production
      - DEMO_MODE=true
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}
      - FIREBASE_STORAGE_BUCKET=${FIREBASE_STORAGE_BUCKET}
    depends_on:
      - redis
    restart: unless-stopped
    volumes:
      - ./storage_data:/app/storage_data

  # Celery Asynchronous Document Worker
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: studypath-celery-worker
    command: celery -A app.tasks.celery_app.celery_app worker --loglevel=info --concurrency=4
    environment:
      - REDIS_URL=redis://redis:6379/0
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}
      - FIREBASE_STORAGE_BUCKET=${FIREBASE_STORAGE_BUCKET}
    depends_on:
      - redis
    restart: unless-stopped
    volumes:
      - ./storage_data:/app/storage_data

  # Vite React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: studypath-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  redis_data:
